// PIN hashing
const hashPin = (pin) => {
  let h = 0;
  for (let i = 0; i < pin.length; i++) h = ((h << 5) - h) + pin.charCodeAt(i) & 0xffffffff;
  return h.toString();
};

};

const SUPP_PIN = hashPin('9999');

// IndexedDB
const DB = 'IronProtocolDB_v15';
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open(DB, 1);
  r.onerror = () => rej(r.error);
  r.onsuccess = () => res(r.result);
  r.onupgradeneeded = e => e.target.result.createObjectStore('data', { keyPath: 'id' });
});

const save = async (id, data) => {
  try {
    const db = await openDB();
    return new Promise(res => {
      const tx = db.transaction('data', 'readwrite');
      tx.objectStore('data').put({ id, ...data, ts: Date.now() });
      tx.oncomplete = () => res(true);
    });
  } catch (e) {
    return false;
  }
};

const load = async (id) => {
  try {
    const db = await openDB();
    return new Promise(res => {
      const q = db.transaction('data', 'readonly').objectStore('data').get(id);
      q.onsuccess = () => res(q.result);
    });
  } catch (e) {
    return null;
  }
};

// MAIN APP

  const [suppPin, setSuppPin] = useState('');
  const [error, setError] = useState('');

    const loadUser = async () => {
      const u = await load('currentUser');
      if (u) setUser(u.user);
    };
    loadUser();
  }, []);

  const login = async (username) => {
    if (hashPin(pin) !== userPins[username]) {
      setError('Wrong PIN');
      return;
    }
    setUser(username);
    setPin('');
    setError('');
    await save('currentUser', { user: username });
  };

  const logout = () => {
    setUser(null);
    setView('workout');
    setPin('');
    setSuppAuth(false);
    setSuppPin('');
    save('currentUser', { user: null });
  };

  const authSupp = () => {
    if (hashPin(suppPin) !== SUPP_PIN) {
      setError('Wrong supplement PIN');
      return;
    }
    setSuppAuth(true);
    setSuppPin('');
    setError('');
  };

      <div className="flex flex-col items-center justify-center min-h-screen bg-black p-4">

          ))}
        </div>
        <div className="w-full max-w-sm bg-zinc-900 p-6 rounded-lg border border-zinc-800">
          <input type="password" placeholder="PIN" value={pin} onChange={(e) => setPin(e.target.value)} maxLength="4" className="w-full bg-zinc-800 text-white text-center text-2xl rounded py-2 mb-4"/>

    );

    <div className="min-h-screen bg-black text-white pb-24">

        <button onClick={logout} className="p-2 bg-zinc-800 rounded-lg"><Icon name="Logout"/></button>

                    <p className="font-semibold">{item.name}</p>
                    <p className="text-sm text-zinc-400">{item.dose} • {item.type}</p>
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}

        {view === 'supplements' && hasSupps && !suppAuth && (
          <div className="max-w-sm mx-auto mt-8">
            <h2 className="text-xl font-bold mb-4">Supplement Access</h2>
            <input type="password" placeholder="PIN" value={suppPin} onChange={(e) => setSuppPin(e.target.value)} maxLength="4" className="w-full bg-zinc-800 text-white text-center text-2xl rounded py-2 mb-4"/>
            <button onClick={authSupp} className="w-full bg-purple-600 text-white py-3 rounded-lg font-semibold">Unlock</button>
            {error && <p className="text-red-400 text-sm mt-2">{error}</p>}
          </div>
        )}
      </div>

      {/* Bottom Nav */}
      <div className="fixed bottom-0 left-0 right-0 bg-zinc-900 border-t border-zinc-800 flex justify-around py-3 safe-bottom">
        <button onClick={() => { setView('workout'); setSuppAuth(false); }} className={`flex-1 text-center ${view === 'workout' ? 'text-purple-400' : 'text-zinc-500'}`}><Icon name="Dumbbell"/></button>
        {hasSupps && <button onClick={() => setView('supplements')} className={`flex-1 text-center ${view === 'supplements' ? 'text-purple-400' : 'text-zinc-500'}`}><Icon name="Pill"/></button>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
