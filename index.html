<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>Iron Protocol</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: #0a0a0a; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    input[type="password"] { letter-spacing: 0.3em; }
    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 16px); }
    .no-sb::-webkit-scrollbar { display: none; }
    .no-sb { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect } = React;

// PIN hash
const hashPin = (pin) => {
  let h = 0;
  for (let i = 0; i < pin.length; i++) h = ((h << 5) - h) + pin.charCodeAt(i) & 0xffffffff;
  return h.toString();
};

const userPins = { greg: hashPin('1234'), ricki: hashPin('5678'), dalton: hashPin('0000'), denver: hashPin('2626'), brandon: hashPin('1980'), shayla: hashPin('1111') };
const SUPP_PIN = hashPin('9999');

// DB
const DB = 'IronDB_v15';
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open(DB, 1);
  r.onerror = () => rej(r.error);
  r.onsuccess = () => res(r.result);
  r.onupgradeneeded = e => e.target.result.createObjectStore('data', { keyPath: 'id' });
});

const save = async (id, data) => {
  try { const db = await openDB(); return new Promise(res => { const tx = db.transaction('data', 'readwrite'); tx.objectStore('data').put({ id, ...data, ts: Date.now() }); tx.oncomplete = () => res(true); }); } catch (e) { return false; }
};

const load = async (id) => {
  try { const db = await openDB(); return new Promise(res => { const q = db.transaction('data', 'readonly').objectStore('data').get(id); q.onsuccess = () => res(q.result); }); } catch (e) { return null; }
};

// User color themes
const userThemes = {
  greg: { accent: 'text-purple-400', button: 'bg-purple-600 hover:bg-purple-700', border: 'border-purple-500', pill: 'bg-purple-500/20' },
  ricki: { accent: 'text-rose-400', button: 'bg-rose-600 hover:bg-rose-700', border: 'border-rose-500', pill: 'bg-rose-500/20' },
  dalton: { accent: 'text-blue-400', button: 'bg-blue-600 hover:bg-blue-700', border: 'border-blue-500', pill: 'bg-blue-500/20' },
  denver: { accent: 'text-emerald-400', button: 'bg-emerald-600 hover:bg-emerald-700', border: 'border-emerald-500', pill: 'bg-emerald-500/20' },
  brandon: { accent: 'text-amber-400', button: 'bg-amber-600 hover:bg-amber-700', border: 'border-amber-500', pill: 'bg-amber-500/20' },
  shayla: { accent: 'text-pink-400', button: 'bg-pink-600 hover:bg-pink-700', border: 'border-pink-500', pill: 'bg-pink-500/20' }
};

// Workout data
const workouts = {
  greg: { mon: { name: 'Chest/Shoulder', exs: [{ n: 'Barbell Bench' }, { n: 'Incline Press' }, { n: 'Lateral Raise' }] }, tue: { name: 'Back/Biceps', exs: [{ n: 'Lat Pulldown' }, { n: 'Rows' }, { n: 'Curls' }] }, wed: { name: 'Legs', exs: [{ n: 'Leg Press' }, { n: 'Squat' }, { n: 'Curl' }] }, thu: { name: 'Rest' }, fri: { name: 'Full Body', exs: [{ n: 'Deadlift' }, { n: 'Cardio' }] }, sat: { name: 'Active Recovery' }, sun: { name: 'Rest' } },
  denver: { mon: { name: 'Lower A', exs: [{ n: 'Goblet Squat' }, { n: 'RDL' }] }, tue: { name: 'Upper A', exs: [{ n: 'Chest Press' }, { n: 'Row' }] }, wed: { name: 'Rest' }, thu: { name: 'Lower B', exs: [{ n: 'Leg Press' }] }, fri: { name: 'Upper B', exs: [{ n: 'Press' }] }, sat: { name: 'Cardio' }, sun: { name: 'Rest' } },
  ricki: { mon: { name: 'Push', exs: [{ n: 'Press' }] }, tue: { name: 'Pull', exs: [{ n: 'Pull' }] }, wed: { name: 'Legs' }, thu: { name: 'Rest' }, fri: { name: 'Full' }, sat: { name: 'Cardio' }, sun: { name: 'Rest' } },
  dalton: { mon: { name: 'Chest' }, tue: { name: 'Back' }, wed: { name: 'Rest' }, thu: { name: 'Legs' }, fri: { name: 'Arms' }, sat: { name: 'Cardio' }, sun: { name: 'Rest' } },
  brandon: { mon: { name: 'Push 1' }, tue: { name: 'Pull 1' }, wed: { name: 'Legs 1' }, thu: { name: 'Push 2' }, fri: { name: 'Pull 2' }, sat: { name: 'Legs 2' }, sun: { name: 'Rest' } },
  shayla: { mon: { name: 'Lower A' }, tue: { name: 'Upper A' }, wed: { name: 'Rest' }, thu: { name: 'Lower B' }, fri: { name: 'Upper B' }, sat: { name: 'Cardio' }, sun: { name: 'Rest' } }
};

const suppData = { greg: [{ day: 'Daily', items: ['Tesamorelin', 'Ipamorelin'] }, { day: 'Mon', items: ['TRT'] }, { day: 'Thu', items: ['TB-500', 'Retatrutide'] }], ricki: [{ day: 'Daily', items: ['Tesamorelin', 'Ipamorelin'] }, { day: 'Thu', items: ['Retatrutide'] }] };

function App() {
  const [user, setUser] = useState(null);
  const [pin, setPin] = useState('');
  const [error, setError] = useState('');
  const [view, setView] = useState('workout');
  const [day, setDay] = useState('mon');
  const [gym, setGym] = useState(true);
  const [suppAuth, setSuppAuth] = useState(false);
  const [suppPin, setSuppPin] = useState('');

  useEffect(() => {
    const loadUser = async () => { const u = await load('user'); if (u) setUser(u.user); };
    loadUser();
  }, []);

  const login = async (u) => {
    if (hashPin(pin) !== userPins[u]) { setError('Wrong PIN'); setPin(''); return; }
    setUser(u); setPin(''); setError(''); await save('user', { user: u });
  };

  const logout = () => { setUser(null); setPin(''); setError(''); setSuppAuth(false); setSuppPin(''); save('user', { user: null }); };

  const authSupp = () => {
    if (hashPin(suppPin) !== SUPP_PIN) { setError('Wrong PIN'); return; }
    setSuppAuth(true); setSuppPin(''); setError('');
  };

  const theme = user ? userThemes[user] : null;
  const dayLabels = { mon: 'Monday', tue: 'Tuesday', wed: 'Wednesday', thu: 'Thursday', fri: 'Friday', sat: 'Saturday', sun: 'Sunday' };
  const hasSupps = user === 'greg' || user === 'ricki';
  const workout = workouts[user] ? workouts[user][day] : null;

  if (!user) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-slate-900 to-black flex flex-col items-center justify-center p-4">
        <div className="mb-12 text-center">
          <h1 className="text-5xl font-bold tracking-tight mb-2">IRON PROTOCOL</h1>
          <p className="text-slate-400 text-lg">Select Profile to Begin</p>
        </div>
        <div className="w-full max-w-md space-y-3 mb-8">
          {Object.keys(userThemes).map(u => (
            <button key={u} onClick={() => { setView(u === view ? 'workout' : u); }} className={`w-full p-4 rounded-lg font-semibold transition-all border-2 ${view === u ? `${userThemes[u].button} border-${userThemes[u].border.split('-')[1]}-500` : 'bg-slate-800 border-slate-700 text-slate-300'}`}>
              {u.charAt(0).toUpperCase() + u.slice(1)}
            </button>
          ))}
        </div>
        <div className="w-full max-w-md bg-slate-800/50 backdrop-blur border border-slate-700 rounded-xl p-6">
          <input type="password" placeholder="PIN" value={pin} onChange={(e) => { setPin(e.target.value); setError(''); }} maxLength="4" className="w-full bg-slate-900 text-white text-center text-3xl rounded-lg py-3 mb-4 border border-slate-600" />
          <button onClick={() => login(view)} className={`w-full ${theme ? userThemes[view].button : 'bg-slate-600'} text-white py-3 rounded-lg font-semibold transition-all`}>
            Login
          </button>
          {error && <p className="text-red-400 text-sm mt-3 text-center">{error}</p>}
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-950 text-white flex flex-col">
      {/* HEADER */}
      <div className={`sticky top-0 z-20 ${theme.pill} border-b border-slate-700 px-4 py-4 flex justify-between items-center`}>
        <div className="flex-1">
          <h1 className={`text-2xl font-bold ${theme.accent}`}>{user.toUpperCase()}</h1>
          <p className="text-slate-400 text-sm">{dayLabels[day]}</p>
        </div>
        <button onClick={logout} className="px-4 py-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition-all">Logout</button>
      </div>

      {/* DAY & MODE SELECTOR */}
      <div className={`sticky top-16 z-10 bg-slate-900/80 backdrop-blur border-b border-slate-700 px-4 py-4`}>
        <div className="mb-4">
          <p className="text-xs text-slate-400 mb-2 font-semibold uppercase">Select Day</p>
          <div className="flex gap-2 overflow-x-auto no-sb pb-2">
            {Object.keys(dayLabels).map(d => (
              <button key={d} onClick={() => setDay(d)} className={`flex-shrink-0 px-4 py-2 rounded-lg font-semibold transition-all ${day === d ? theme.button : 'bg-slate-800 hover:bg-slate-700'}`}>
                {d.toUpperCase()}
              </button>
            ))}
          </div>
        </div>
        {user !== 'ricki' && (
          <div>
            <p className="text-xs text-slate-400 mb-2 font-semibold uppercase">Mode</p>
            <div className="flex gap-2">
              <button onClick={() => setGym(true)} className={`flex-1 py-2 rounded-lg font-semibold transition-all ${gym ? theme.button : 'bg-slate-800 hover:bg-slate-700'}`}>Gym</button>
              <button onClick={() => setGym(false)} className={`flex-1 py-2 rounded-lg font-semibold transition-all ${!gym ? theme.button : 'bg-slate-800 hover:bg-slate-700'}`}>Home</button>
            </div>
          </div>
        )}
      </div>

      {/* CONTENT */}
      <div className="flex-1 overflow-y-auto no-sb p-4">
        <div className="max-w-2xl mx-auto">
          {view === 'workout' && workout && (
            <>
              <h2 className={`text-3xl font-bold mb-6 ${theme.accent}`}>{workout.name}</h2>
              {workout.exs && workout.exs.length > 0 ? (
                <div className="space-y-3">
                  {workout.exs.map((ex, i) => (
                    <div key={i} className={`bg-slate-800/50 border ${theme.border} border-opacity-30 rounded-lg p-4 hover:bg-slate-800/70 transition-all`}>
                      <p className="font-semibold text-lg">{ex.n}</p>
                      <p className="text-slate-400 text-sm mt-1">{gym ? 'Gym mode' : 'Home mode'}</p>
                    </div>
                  ))}
                </div>
              ) : (
                <p className="text-slate-400 text-center py-8">Rest Day</p>
              )}
            </>
          )}

          {view === 'supplements' && hasSupps && !suppAuth && (
            <div className="max-w-sm mx-auto py-12">
              <h2 className="text-2xl font-bold mb-6 text-center">Supplement Access</h2>
              <input type="password" placeholder="PIN" value={suppPin} onChange={(e) => setSuppPin(e.target.value)} maxLength="4" className="w-full bg-slate-800 text-white text-center text-3xl rounded-lg py-3 mb-4 border border-slate-600" />
              <button onClick={authSupp} className={`w-full ${theme.button} text-white py-3 rounded-lg font-semibold`}>Unlock</button>
              {error && <p className="text-red-400 text-sm mt-3 text-center">{error}</p>}
            </div>
          )}

          {view === 'supplements' && hasSupps && suppAuth && (
            <>
              <h2 className={`text-3xl font-bold mb-6 ${theme.accent}`}>Supplements</h2>
              <div className="space-y-4">
                {suppData[user]?.map((section, i) => (
                  <div key={i}>
                    <p className={`text-sm font-semibold ${theme.accent} mb-2`}>{section.day}</p>
                    {section.items.map((item, j) => (
                      <div key={j} className={`bg-slate-800/50 border ${theme.border} border-opacity-30 rounded-lg p-3 mb-2`}>
                        <p className="font-semibold">{item}</p>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            </>
          )}
        </div>
      </div>

      {/* BOTTOM NAV */}
      <div className={`sticky bottom-0 bg-slate-900 border-t border-slate-700 safe-bottom flex justify-around py-3`}>
        <button onClick={() => { setView('workout'); setSuppAuth(false); }} className={`flex-1 text-center py-2 transition-all ${view === 'workout' ? theme.accent : 'text-slate-400'}`}>
          💪 Workout
        </button>
        {hasSupps && (
          <button onClick={() => setView('supplements')} className={`flex-1 text-center py-2 transition-all ${view === 'supplements' ? theme.accent : 'text-slate-400'}`}>
            💊 Supps
          </button>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
