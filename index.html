  const[schedMode,setSchedMode]=useState(false); // Schedule customization mode

  const td=new Date(),tdow=td.getDay(),dk=td.toISOString().split('T')[0];
  const pk=useMemo(()=>user?(isDual(user)?(gymMode?`${user}_gym`:`${user}_home`):`${user}_standard`):'', [user,gymMode]);
  const gDP=useCallback(()=>{if(!user)return{};if(isDual(user))return gymMode?DP[user].gym:DP[user].home;return DP[user].standard},[user,gymMode]);
  const cP=useMemo(()=>custProg[pk]||gDP(),[custProg,pk,gDP]);
  const cW=cP[selDay],exs=cW?cW.exercises:[];

  useEffect(()=>{if(!user)return;(async()=>{const w=await ld(`${user}_wl`);if(w?.l)setWL(w.l);const s=await ld(`${user}_sl`);if(s?.l)setSL(s.l);const p=await ld(`${user}_pr`);if(p?.gm!==undefined)setGM(p.gm);const c=await ld(`${user}_cp`);if(c?.p)setCP(c.p)})()},[user]);
  useEffect(()=>{if(user)sv(`${user}_wl`,{l:wLogs})},[wLogs,user]);
  useEffect(()=>{if(user)sv(`${user}_sl`,{l:sLogs})},[sLogs,user]);
  useEffect(()=>{if(user)sv(`${user}_pr`,{gm:gymMode})},[gymMode,user]);
  useEffect(()=>{if(user)sv(`${user}_cp`,{p:custProg})},[custProg,user]);

  const doLogin=u=>{setUser(u);setPin('');setPE(false)};
  const doAuth=()=>{if(hashPin(pin)===UP[user])setAuth(true);else{setPE(true);setPin('')}};
  const doLogout=()=>{setUser(null);setAuth(false);setSuppAuth(false);setSuppPin('');setSuppPE(false);setPin('');setWL({});setSL({});setCP({});setView('workout');setEM(false);setAD(null);setSchedMode(false)};

  const enC=()=>{if(!custProg[pk])setCP(p=>({...p,[pk]:JSON.parse(JSON.stringify(gDP()))}))};
  const rmEx=(d,i)=>{enC();setCP(p=>{const g=JSON.parse(JSON.stringify(p[pk]||gDP()));g[d].exercises.splice(i,1);return{...p,[pk]:g}})};
  const mvEx=(d,i,dir)=>{enC();setCP(p=>{const g=JSON.parse(JSON.stringify(p[pk]||gDP()));const a=g[d].exercises;const n=i+dir;if(n<0||n>=a.length)return p;[a[i],a[n]]=[a[n],a[i]];return{...p,[pk]:g}})};
  const addEx=(d,ex)=>{enC();setCP(p=>{const g=JSON.parse(JSON.stringify(p[pk]||gDP()));g[d].exercises.push({...ex,muscle:libGrp});return{...p,[pk]:g}})};
  const rstDay=d=>{const def=gDP();setCP(p=>{const g=JSON.parse(JSON.stringify(p[pk]||def));g[d]=JSON.parse(JSON.stringify(def[d]));return{...p,[pk]:g}})};
  const rstAll=()=>setCP(p=>{const n={...p};delete n[pk];return n});

  // Schedule customization: change a day's focus and auto-populate exercises
  const changeDayFocus=(dayNum,newFocus)=>{
    enC();
    setCP(p=>{
      const g=JSON.parse(JSON.stringify(p[pk]||gDP()));
      const tmpl=focusTemplates[newFocus];
      const shortName=newFocus.split('(')[0].split('-')[0].trim();
      g[dayNum]={name:shortName,focus:newFocus,exercises:JSON.parse(JSON.stringify(tmpl.exercises))};
      return{...p,[pk]:g};
    });
  };

  const lk=(d,e,s,f)=>`${dk}_d${d}_e${e}_s${s}_${f}`;const gL=(d,e,s,f)=>wLogs[lk(d,e,s,f)]||'';const sL=(d,e,s,f,v)=>setWL(p=>({...p,[lk(d,e,s,f)]:v}));
  const dK=(d,e,s)=>`${dk}_d${d}_e${e}_s${s}_dn`;const iD=(d,e,s)=>wLogs[dK(d,e,s)]===true;const tD=(d,e,s)=>setWL(p=>({...p,[dK(d,e,s)]:!p[dK(d,e,s)]}));
  const sk=n=>`${dk}_${n}`;const isSD=n=>sLogs[sk(n)]===true;const tS=n=>setSL(p=>({...p,[sk(n)]:!p[sk(n)]}));
  const uS=user?SP[user]:{daily:[],weekly:[]};const tSp=[...uS.daily,...uS.weekly.filter(s=>s.days.includes(tdow))];

  const uc={greg:{a:'text-purple-400',b:'bg-purple-500',bl:'bg-purple-500/20',bd:'border-purple-500'},ricki:{a:'text-rose-400',b:'bg-rose-500',bl:'bg-rose-500/20',bd:'border-rose-500'},dalton:{a:'text-blue-400',b:'bg-blue-500',bl:'bg-blue-500/20',bd:'border-blue-500'},denver:{a:'text-emerald-400',b:'bg-emerald-500',bl:'bg-emerald-500/20',bd:'border-emerald-500'}}[user]||{a:'text-purple-400',b:'bg-purple-500',bl:'bg-purple-500/20',bd:'border-purple-500'};

  if(!user)return(<div className="min-h-screen bg-zinc-950 text-white flex flex-col items-center justify-center p-6"><div className="mb-8 text-center"><I.Dumbbell s={48} c="text-purple-400 mx-auto mb-4"/><h1 className="text-3xl font-bold">IRON PROTOCOL</h1><p className="text-zinc-500 mt-2">Select your profile</p></div><div className="w-full max-w-xs space-y-3">{[{id:'greg',l:'Greg',e:'\u{1F3CB}'},{id:'ricki',l:'Ricki',e:'\u{1F4AA}'},{id:'dalton',l:'Dalton',e:'\u26A1'},{id:'denver',l:'Denver',e:'\u{1F31F}'}].map(u=><button key={u.id} onClick={()=>doLogin(u.id)} className="w-full p-4 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-zinc-600 transition-all flex items-center gap-4"><span className="text-2xl">{u.e}</span><span className="text-lg font-semibold">{u.l}</span></button>)}</div></div>);

  if(!authed)return(<div className="min-h-screen bg-zinc-950 text-white flex flex-col items-center justify-center p-6"><button onClick={()=>setUser(null)} className="absolute top-6 left-6 text-zinc-500">{'\u2190'} Back</button><h2 className="text-2xl font-bold mb-2 capitalize">{user}</h2><p className="text-zinc-500 mb-6">Enter 4-digit PIN</p><input type="password" maxLength={4} value={pin} onChange={e=>{setPin(e.target.value.replace(/\D/g,''));setPE(false)}} onKeyDown={e=>e.key==='Enter'&&doAuth()} className={`w-48 text-center text-2xl p-3 rounded-xl bg-zinc-900 border ${pinErr?'border-red-500':'border-zinc-700'} focus:outline-none focus:border-purple-500`} autoFocus placeholder={'\u2022\u2022\u2022\u2022'}/>{pinErr&&<p className="text-red-400 text-sm mt-2">Wrong PIN</p>}<button onClick={doAuth} className={`mt-4 px-8 py-3 rounded-xl ${uc.b} text-white font-semibold`}>Unlock</button></div>);

  return(<div className="min-h-screen bg-zinc-950 text-white pb-24">
    <header className="sticky top-0 z-50 bg-zinc-950/95 backdrop-blur border-b border-zinc-800 px-4 py-3"><div className="flex items-center justify-between"><div><h1 className={`text-lg font-bold ${uc.a}`}>IRON PROTOCOL</h1><p className="text-xs text-zinc-500 capitalize">{user} {'\u2022'} {DN[tdow]}</p></div><div className="flex items-center gap-2">
      {isDual(user)&&view==='workout'&&<div className="flex items-center bg-zinc-900 rounded-full px-1 py-0.5"><button onClick={()=>setGM(false)} className={`p-1.5 rounded-full transition-all ${!gymMode?uc.bl+' '+uc.a:'text-zinc-500'}`}><I.Home s={14}/></button><button onClick={()=>setGM(true)} className={`p-1.5 rounded-full transition-all ${gymMode?uc.bl+' '+uc.a:'text-zinc-500'}`}><I.Bld s={14}/></button></div>}
      {view==='workout'&&!schedMode&&<button onClick={()=>{setEM(!editMode);setAD(null)}} className={`p-2 rounded-lg transition-all ${editMode?uc.b+' text-white':'text-zinc-500'}`}>{editMode?<I.Check s={18}/>:<span className="text-xs font-bold">EDIT</span>}</button>}
      <button onClick={doLogout} className="text-zinc-500 p-2"><I.Out s={18}/></button>
    </div></div></header>

    <main className="px-4 pt-4">
      {view==='workout'&&!schedMode&&<div>
        <div className="flex gap-1 mb-4">{['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>{const dn=i+1,isT=DM[tdow]===dn,isS=selDay===dn;return<button key={d} onClick={()=>{setSD(dn);setSI(null);setAD(null)}} className={`flex-1 py-2 rounded-lg text-xs font-medium transition-all ${isS?uc.b+' text-white':isT?uc.bl+' '+uc.a:'bg-zinc-900 text-zinc-500'}`}>{d}</button>})}</div>

        {selDay===7?<div className="text-center py-16"><p className="text-4xl mb-4">{'\u{1F634}'}</p><h2 className="text-xl font-bold">Rest Day</h2><p className="text-zinc-500 mt-2">Recover. Sleep. Eat protein.</p></div>
        :cW?<div>
          <div className="flex justify-between items-start mb-4"><div><h2 className="text-xl font-bold">{cW.name}</h2><p className="text-sm text-zinc-500">{cW.focus}</p>{isDual(user)&&<span className={`inline-block mt-1 text-xs px-2 py-0.5 rounded-full ${uc.bl} ${uc.a}`}>{gymMode?'\u{1F3E2} Gym':'\u{1F3E0} At Home'}</span>}</div>
            {editMode&&<button onClick={()=>rstDay(selDay)} className="text-xs text-zinc-500 flex items-center gap-1 bg-zinc-900 px-2 py-1 rounded-lg"><I.Rst s={12}/> Reset</button>}
          </div>
          <div className="space-y-3">{exs.map((ex,ei)=>{
            if(ex.name&&ex.name.startsWith('---'))return<div key={ei} className={`text-center text-sm font-bold ${uc.a} py-2 border-t border-zinc-800 mt-4`}>{ex.name.replace(/---/g,'').trim()}</div>;
            return<div key={ei} className="bg-zinc-900 rounded-xl p-3 border border-zinc-800">
              <div className="flex justify-between items-start mb-2"><div className="flex-1 min-w-0"><h3 className="font-semibold text-sm truncate">{ex.name}</h3><p className="text-xs text-zinc-500">{ex.muscle||''} {ex.muscle?'\u2022':''} {ex.sets}x{ex.reps}</p></div>
                <div className="flex items-center gap-1 flex-shrink-0">{editMode?<><button onClick={()=>mvEx(selDay,ei,-1)} className="text-zinc-600 p-1"><I.Up s={14}/></button><button onClick={()=>mvEx(selDay,ei,1)} className="text-zinc-600 p-1"><I.Dn s={14}/></button><button onClick={()=>rmEx(selDay,ei)} className="text-red-500 p-1"><I.X s={14}/></button></>:ex.notes&&<button onClick={()=>setSI(showInf===ei?null:ei)} className="text-zinc-500 p-1"><I.Inf s={14}/></button>}</div>
              </div>
              {!editMode&&showInf===ei&&ex.notes&&<p className={`text-xs ${uc.a} mb-2 p-2 rounded ${uc.bl}`}>{ex.notes}</p>}
              {!editMode&&<div className="space-y-1.5">{Array.from({length:ex.sets},(_,si)=><div key={si} className="flex items-center gap-2"><span className="text-xs text-zinc-600 w-5">{si+1}</span><input type="number" placeholder="lbs" value={gL(selDay,ei,si,'wt')} onChange={e=>sL(selDay,ei,si,'wt',e.target.value)} className="w-16 bg-zinc-800 rounded px-2 py-1.5 text-xs text-center focus:outline-none focus:ring-1 focus:ring-purple-500"/><input type="number" placeholder="reps" value={gL(selDay,ei,si,'rp')} onChange={e=>sL(selDay,ei,si,'rp',e.target.value)} className="w-16 bg-zinc-800 rounded px-2 py-1.5 text-xs text-center focus:outline-none focus:ring-1 focus:ring-purple-500"/><button onClick={()=>tD(selDay,ei,si)} className={`w-7 h-7 rounded-full flex items-center justify-center transition-all ${iD(selDay,ei,si)?uc.b+' text-white':'bg-zinc-800 text-zinc-600'}`}><I.Check s={14}/></button></div>)}</div>}
            </div>})}</div>
          {editMode&&<div className="mt-4">{addDay===selDay?<div className="bg-zinc-900 border border-zinc-800 rounded-xl p-4"><div className="flex justify-between items-center mb-3"><h3 className="font-bold text-sm">Add Exercise</h3><button onClick={()=>setAD(null)} className="text-zinc-500"><I.X s={16}/></button></div><div className="flex gap-1 overflow-x-auto no-sb pb-2 mb-3">{MG.map(g=><button key={g} onClick={()=>setLG(g)} className={`px-3 py-1 rounded-full text-xs whitespace-nowrap transition-all ${libGrp===g?uc.b+' text-white':'bg-zinc-800 text-zinc-400'}`}>{g}</button>)}</div><div className="space-y-1 max-h-64 overflow-y-auto">{EL[libGrp].map((ex,i)=><div key={i} className="flex justify-between items-center p-2 rounded-lg bg-zinc-800"><div><p className="text-sm font-medium">{ex.name}</p><p className="text-xs text-zinc-500">{ex.sets}x{ex.reps} {'\u2022'} {ex.notes}</p></div><button onClick={()=>addEx(selDay,ex)} className={`${uc.a} p-1`}><I.Plus s={18}/></button></div>)}</div></div>:<button onClick={()=>setAD(selDay)} className="w-full p-3 rounded-xl border-2 border-dashed border-zinc-700 text-zinc-500 flex items-center justify-center gap-2 hover:border-zinc-500 transition-all"><I.Plus s={18}/> Add Exercise from Library</button>}</div>}
        </div>:<div className="text-center py-16 text-zinc-500">No workout</div>}
      </div>}

      {/* SCHEDULE CUSTOMIZATION VIEW */}
      {(view==='workout'&&schedMode)||(view==='schedule')?(()=>{
        if(view!=='schedule'&&!schedMode)return null;
        return<div>
          <div className="flex justify-between items-center mb-4"><div><h2 className="text-xl font-bold">Customize Schedule</h2><p className="text-sm text-zinc-500">Pick a workout focus for each day</p></div><button onClick={()=>{setSchedMode(false);setView('workout')}} className={`px-3 py-1.5 rounded-lg text-sm ${uc.b} text-white font-semibold`}>Done</button></div>
          <div className="space-y-3">
            {['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map((day,i)=>{
              const dn=i+1;const w=dn<=6?cP[dn]:null;const isT=DM[tdow]===dn;
              return<div key={day} className={`bg-zinc-900 rounded-xl p-4 border ${isT?uc.bd:'border-zinc-800'}`}>
                <p className={`font-semibold text-sm mb-2 ${isT?uc.a:'text-white'}`}>{day}</p>
                {dn===7?<p className="text-sm text-zinc-500">Rest Day</p>
                :<select value={w?.focus||'Rest Day'} onChange={e=>changeDayFocus(dn,e.target.value)}
                  className="w-full bg-zinc-800 text-white rounded-lg px-3 py-2 text-sm border border-zinc-700 focus:outline-none focus:border-purple-500">
                  {focusOptions.map(f=><option key={f} value={f}>{f}</option>)}
                </select>}
                {dn<=6&&w&&w.exercises.length>0&&<p className="text-xs text-zinc-500 mt-2">{w.exercises.length} exercises</p>}
              </div>
            })}
          </div>
          <button onClick={rstAll} className="w-full mt-6 p-3 rounded-xl bg-zinc-900 border border-red-500/30 text-red-400 text-sm flex items-center justify-center gap-2"><I.Rst s={14}/> Reset All to Default Program</button>
        </div>
      })():null}

      {view==='library'&&<div>
        <h2 className="text-xl font-bold mb-1">Exercise Library</h2><p className="text-sm text-zinc-500 mb-4">Browse by muscle group. Use EDIT on Workout tab to add to your program.</p>
        <div className="flex gap-1 overflow-x-auto no-sb pb-2 mb-4">{MG.map(g=><button key={g} onClick={()=>setLG(g)} className={`px-3 py-1.5 rounded-full text-xs whitespace-nowrap transition-all ${libGrp===g?uc.b+' text-white':'bg-zinc-800 text-zinc-400'}`}>{g}</button>)}</div>
        <div className="space-y-2">{EL[libGrp].map((ex,i)=><div key={i} className="bg-zinc-900 border border-zinc-800 rounded-xl p-3"><h3 className="font-semibold text-sm">{ex.name}</h3><p className="text-xs text-zinc-500 mt-1">{ex.sets} sets x {ex.reps}</p>{ex.notes&&<p className={`text-xs ${uc.a} mt-1`}>{ex.notes}</p>}</div>)}</div>
      </div>}

      {view==='supplements'&&<div>
        {!suppAuthed?<div className="flex flex-col items-center justify-center py-16"><I.Pill s={48} c={`${uc.a} mb-4`}/><h2 className="text-xl font-bold mb-2">Supplements Locked</h2><p className="text-zinc-500 mb-6">Enter supplements PIN</p><input type="password" maxLength={4} value={suppPin} onChange={e=>{setSuppPin(e.target.value.replace(/\D/g,''));setSuppPE(false)}} onKeyDown={e=>{if(e.key==='Enter'&&suppPin.length===4){if(hashPin(suppPin)===SUPP_PIN){setSuppAuth(true);setSuppPin('')}else{setSuppPE(true);setSuppPin('')}}}} className={`w-48 text-center text-2xl p-3 rounded-xl bg-zinc-900 border ${suppPinErr?'border-red-500':'border-zinc-700'} focus:outline-none focus:border-purple-500`} autoFocus placeholder={'\u2022\u2022\u2022\u2022'}/>{suppPinErr&&<p className="text-red-400 text-sm mt-2">Wrong PIN</p>}<button onClick={()=>{if(hashPin(suppPin)===SUPP_PIN){setSuppAuth(true);setSuppPin('')}else{setSuppPE(true);setSuppPin('')}}} className={`mt-4 px-8 py-3 rounded-xl ${uc.b} text-white font-semibold`}>Unlock</button></div>
        :<div>
        <h2 className="text-xl font-bold mb-1">Supplements</h2><p className="text-sm text-zinc-500 mb-4">{DN[tdow]} {'\u2022'} {dk}</p>
        {tSp.length===0?<div className="text-center py-16"><p className="text-4xl mb-4">{'\u2728'}</p><p className="text-zinc-500">No supplements to track today</p></div>
        :<div className="space-y-2">{tSp.map((s,i)=><button key={i} onClick={()=>tS(s.name)} className={`w-full flex items-center gap-3 p-3 rounded-xl border transition-all ${isSD(s.name)?'bg-emerald-500/10 border-emerald-500/30':'bg-zinc-900 border-zinc-800'}`}><div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${isSD(s.name)?'bg-emerald-500 text-white':'bg-zinc-800 text-zinc-600'}`}>{isSD(s.name)?<I.Check s={16}/>:<span className="text-xs">{s.type==='injection'?'\u{1F489}':'\u{1F48A}'}</span>}</div><div className="text-left flex-1"><p className={`text-sm font-medium ${isSD(s.name)?'text-emerald-400 line-through':'text-white'}`}>{s.name}</p><p className="text-xs text-zinc-500">{s.dose} {'\u2022'} {s.time}</p></div></button>)}</div>}
      </div>}
      </div>}

      {view==='calendar'&&<div>
        <h2 className="text-xl font-bold mb-4">Weekly Schedule</h2>
        <div className="space-y-2">{['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map((day,i)=>{const dn=i+1,w=dn<=6?cP[dn]:null,isT=DM[tdow]===dn;return<button key={day} onClick={()=>{setSD(dn);setView('workout');setSchedMode(false)}} className={`w-full p-3 rounded-xl text-left flex justify-between items-center border transition-all ${isT?uc.bl+' '+uc.bd:'bg-zinc-900 border-zinc-800'}`}><div><p className={`font-semibold text-sm ${isT?uc.a:'text-white'}`}>{day}</p><p className="text-xs text-zinc-500">{w?w.name:'Rest Day'}</p></div><p className="text-xs text-zinc-500">{w?w.focus:'\u{1F634}'}</p></button>})}</div>
        <button onClick={()=>{setView('workout');setSchedMode(true);setEM(false);setAD(null)}} className={`w-full mt-6 p-4 rounded-xl border-2 border-dashed ${uc.bd} ${uc.a} flex items-center justify-center gap-2 text-sm font-semibold`}><I.Gear s={18}/> Customize Daily Schedule</button>
      </div>}
    </main>

    <nav className="fixed bottom-0 left-0 right-0 bg-zinc-950/95 backdrop-blur border-t border-zinc-800 safe-bottom"><div className="flex justify-around py-2">
      {[{id:'workout',icon:I.Dumbbell,l:'Workout'},{id:'library',icon:I.Lib,l:'Exercises'},...(user==='greg'||user==='ricki'?[{id:'supplements',icon:I.Pill,l:'Supps'}]:[]),{id:'calendar',icon:I.Cal,l:'Schedule'}].map(t=><button key={t.id} onClick={()=>{setView(t.id);setEM(false);setAD(null);setSchedMode(false)}} className={`flex flex-col items-center py-2 px-3 transition-all ${view===t.id?uc.a:'text-zinc-500'}`}><t.icon s={22}/><span className="text-xs mt-1">{t.l}</span></button>)}
    </div></nav>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
