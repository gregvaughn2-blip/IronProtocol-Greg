  const hasSupps = user === 'greg' || user === 'ricki';
  const workout = (gym ? WD : HD)[user]?.[day];

  if (!user) return (<div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-4"><h1 className="text-5xl font-bold mb-12 text-white">IRON PROTOCOL</h1><div className="w-full max-w-md space-y-2 mb-8">{Object.keys(UP).map(u => (<button key={u} onClick={() => setView(u)} className={`w-full p-3 rounded-lg font-semibold ${view === u ? `${theme ? uc[u].b : 'bg-slate-700'} text-white` : 'bg-slate-800 text-slate-300'}`}>{u.toUpperCase()}</button>))}</div><div className="w-full max-w-md bg-slate-800 rounded-xl p-6 border border-slate-700"><input type="password" placeholder="PIN" value={pin} onChange={(e) => { setPin(e.target.value); setErr(''); }} maxLength="4" className="w-full bg-slate-900 text-white text-center text-3xl rounded-lg py-3 mb-4 border border-slate-600" /><button onClick={() => login(view)} className={`w-full ${uc[view]?.b || 'bg-slate-600'} text-white py-3 rounded-lg font-semibold`}>Login</button>{err && <p className="text-red-400 text-sm mt-3 text-center">{err}</p>}</div></div>);

  return (<div className="min-h-screen bg-slate-950 text-white flex flex-col pb-24"><div className={`sticky top-0 z-20 ${theme.bl} border-b border-slate-700 px-4 py-4 flex justify-between items-center`}><div><h1 className={`text-2xl font-bold ${theme.a}`}>{user.toUpperCase()}</h1><p className="text-slate-400 text-sm capitalize">{day}</p></div><button onClick={logout} className="px-4 py-2 bg-slate-800 rounded-lg hover:bg-slate-700">Logout</button></div><div className="sticky top-16 z-10 bg-slate-900/80 backdrop-blur border-b border-slate-700 px-4 py-3"><div className="mb-3"><p className="text-xs text-slate-400 mb-2 font-semibold">SELECT DAY</p><div className="flex gap-1 overflow-x-auto no-sb"><button onClick={() => setDay('mon')} className={`flex-shrink-0 px-3 py-2 rounded-lg text-sm font-semibold ${day === 'mon' ? theme.b : 'bg-slate-800'}`}>MON</button><button onClick={() => setDay('tue')} className={`flex-shrink-0 px-3 py-2 rounded-lg text-sm font-semibold ${day === 'tue' ? theme.b : 'bg-slate-800'}`}>TUE</button><button onClick={() => setDay('wed')} className={`flex-shrink-0 px-3 py-2 rounded-lg text-sm font-semibold ${day === 'wed' ? theme.b : 'bg-slate-800'}`}>WED</button><button onClick={() => setDay('thu')} className={`flex-shrink-0 px-3 py-2 rounded-lg text-sm font-semibold ${day === 'thu' ? theme.b : 'bg-slate-800'}`}>THU</button><button onClick={() => setDay('fri')} className={`flex-shrink-0 px-3 py-2 rounded-lg text-sm font-semibold ${day === 'fri' ? theme.b : 'bg-slate-800'}`}>FRI</button><button onClick={() => setDay('sat')} className={`flex-shrink-0 px-3 py-2 rounded-lg text-sm font-semibold ${day === 'sat' ? theme.b : 'bg-slate-800'}`}>SAT</button><button onClick={() => setDay('sun')} className={`flex-shrink-0 px-3 py-2 rounded-lg text-sm font-semibold ${day === 'sun' ? theme.b : 'bg-slate-800'}`}>SUN</button></div></div>{user !== 'ricki' && user !== 'dalton' && (<div><p className="text-xs text-slate-400 mb-2 font-semibold">MODE</p><div className="flex gap-2"><button onClick={() => setGym(true)} className={`flex-1 py-2 rounded-lg font-semibold text-sm ${gym ? theme.b : 'bg-slate-800'}`}>GYM</button><button onClick={() => setGym(false)} className={`flex-1 py-2 rounded-lg font-semibold text-sm ${!gym ? theme.b : 'bg-slate-800'}`}>HOME</button></div></div>)}</div><div className="flex-1 overflow-y-auto no-sb p-4"><div className="max-w-2xl mx-auto">{view === 'workout' && workout && (<div><h2 className={`text-3xl font-bold mb-6 ${theme.a}`}>{workout.n}</h2>{workout.exs && workout.exs.length > 0 ? (<div className="space-y-3">{workout.exs.map((ex, i) => (<div key={i} className={`bg-slate-800/50 border ${theme.bd} border-opacity-30 rounded-lg p-4`}><div className="flex justify-between items-start mb-2"><h3 className="font-semibold text-lg">{ex.n}</h3><span className={`text-xs px-2 py-1 rounded ${theme.bl}`}>{ex.m}</span></div><div className="grid grid-cols-3 gap-3 text-sm mb-2"><div><span className="text-slate-400">Sets</span><p className="font-semibold text-base">{ex.s}</p></div><div><span className="text-slate-400">Reps</span><p className="font-semibold text-base">{ex.r}</p></div><div><span className="text-slate-400">Note</span><p className="font-semibold text-base">{ex.note}</p></div></div></div>))}</div>) : (<p className="text-slate-400 text-center py-12">Rest Day</p>)}</div>)}{view === 'supplements' && hasSupps && !suppAuth && (<div className="max-w-sm mx-auto py-12"><h2 className="text-2xl font-bold mb-6 text-center">Supplement Access</h2><input type="password" placeholder="PIN" value={suppPin} onChange={(e) => setSuppPin(e.target.value)} maxLength="4" className="w-full bg-slate-800 text-white text-center text-3xl rounded-lg py-3 mb-4 border border-slate-600" /><button onClick={authSupp} className={`w-full ${theme.b} text-white py-3 rounded-lg font-semibold`}>Unlock</button>{err && <p className="text-red-400 text-sm mt-3 text-center">{err}</p>}</div>)}{view === 'supplements' && hasSupps && suppAuth && (<div><h2 className={`text-3xl font-bold mb-6 ${theme.a}`}>Supplements</h2><div className="space-y-4">{SP[user]?.map((section, i) => (<div key={i}><p className={`text-sm font-semibold ${theme.a} mb-2`}>{section.d}</p>{section.i.map((item, j) => (<div key={j} className={`bg-slate-800/50 border ${theme.bd} border-opacity-30 rounded-lg p-3 mb-2`}><p className="font-semibold">{item}</p></div>))}</div>))}</div></div>)}</div></div><div className="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-700 safe-bottom flex justify-around py-3"><button onClick={() => { setView('workout'); setSuppAuth(false); }} className={`flex-1 text-center py-2 transition-all ${view === 'workout' ? theme.a : 'text-slate-400'}`}>💪 Workout</button>{hasSupps && <button onClick={() => setView('supplements')} className={`flex-1 text-center py-2 transition-all ${view === 'supplements' ? theme.a : 'text-slate-400'}`}>💊 Supp</button>}</div></div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
