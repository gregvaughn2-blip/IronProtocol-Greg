// ===== PIN SYSTEM =====
const hashPin = (pin) => {
  let h = 0;
  for (let i = 0; i < pin.length; i++) h = ((h << 5) - h) + pin.charCodeAt(i) & 0xffffffff;
  return h.toString();
};

// ===== INDEXED DB =====
const DB = 'IronProtocolDB_v12';
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open(DB, 1);
  r.onerror = () => rej(r.error);
  r.onsuccess = () => res(r.result);
  r.onupgradeneeded = e => e.target.result.createObjectStore('data', { keyPath: 'id' });
});
const save = async (id, data) => {
  try {
    const db = await openDB();
    return new Promise(res => {
      const tx = db.transaction('data', 'readwrite');
      tx.objectStore('data').put({ id, ...data, ts: Date.now() });
      tx.oncomplete = () => res(true);
    });
  } catch(e) { return false; }
};
const load = async (id) => {
  try {
    const db = await openDB();
    return new Promise(res => {
      const r = db.transaction('data', 'readonly').objectStore('data').get(id);
      r.onsuccess = () => res(r.result);
    });
  } catch(e) { return null; }
};

  const hashPin = (pin) => {
    let h = 0;
    for (let i = 0; i < pin.length; i++) h = ((h << 5) - h) + pin.charCodeAt(i) & 0xffffffff;
    return h.toString();
  };

  const workouts = {
    greg: gregWorkouts,
    ricki: rickiWorkouts,
    dalton: daltonWorkouts,
    denver: denverWorkouts,
    brandon: brandonWorkouts,
    shayla: shaylaWorkouts
  }[user] || {};

  const uc = {
    greg: { accent: 'text-purple-400', bg: 'bg-purple-600', bgLight: 'bg-purple-500/20', border: 'border-purple-500' },
    ricki: { accent: 'text-rose-400', bg: 'bg-rose-600', bgLight: 'bg-rose-500/20', border: 'border-rose-500' },
    dalton: { accent: 'text-blue-400', bg: 'bg-blue-600', bgLight: 'bg-blue-500/20', border: 'border-blue-500' },
    denver: { accent: 'text-emerald-400', bg: 'bg-emerald-600', bgLight: 'bg-emerald-500/20', border: 'border-emerald-500' },
    brandon: { accent: 'text-amber-400', bg: 'bg-amber-600', bgLight: 'bg-amber-500/20', border: 'border-amber-500' },
    shayla: { accent: 'text-pink-400', bg: 'bg-pink-600', bgLight: 'bg-pink-500/20', border: 'border-pink-500' }
  }[user] || { accent: 'text-purple-400', bg: 'bg-purple-600', bgLight: 'bg-purple-500/20', border: 'border-purple-500' };

  const todayDow = new Date().getDay();
  const todayNum = dayMap[todayDow];
  const currentWorkout = workouts[selectedDay];
  const userSupps = supplements[user] || { daily: [], weekly: [] };
  const todaySupps = [...userSupps.daily, ...userSupps.weekly.filter(s => s.days.includes(todayDow))];

  const logKey = (day, exIdx, setIdx, field) => `${dateKey}_d${day}_e${exIdx}_s${setIdx}_${field}`;
  const getLog = (day, exIdx, setIdx, field) => workoutLogs[logKey(day, exIdx, setIdx, field)] || '';
  const setLog = (day, exIdx, setIdx, field, val) => {
    setWorkoutLogs(prev => ({ ...prev, [logKey(day, exIdx, setIdx, field)]: val }));
    save('workoutLogs', { data: { ...workoutLogs, [logKey(day, exIdx, setIdx, field)]: val } });
  };

  const completedKey = (day, exIdx, setIdx) => `${dateKey}_d${day}_e${exIdx}_s${setIdx}_done`;
  const isCompleted = (day, exIdx, setIdx) => workoutLogs[completedKey(day, exIdx, setIdx)] === true;
  const toggleComplete = (day, exIdx, setIdx) => {
    const newVal = !isCompleted(day, exIdx, setIdx);
    setWorkoutLogs(prev => ({ ...prev, [completedKey(day, exIdx, setIdx)]: newVal }));
    save('workoutLogs', { data: { ...workoutLogs, [completedKey(day, exIdx, setIdx)]: newVal } });
  };

  const suppKey = (name) => `${dateKey}_${name}`;
  const isSuppDone = (name) => suppLogs[suppKey(name)] === true;
  const toggleSupp = (name) => {
    const newVal = !isSuppDone(name);
    setSuppLogs(prev => ({ ...prev, [suppKey(name)]: newVal }));
    save('suppLogs', { data: { ...suppLogs, [suppKey(name)]: newVal } });
  };

  if (!user) {
    return (
      <div className="min-h-screen bg-zinc-950 flex flex-col items-center justify-center p-6">
        <h1 className="text-5xl font-bold mb-12 text-white">IRON PROTOCOL</h1>
        <div className="w-full max-w-md space-y-2 mb-8">
          {['greg', 'ricki', 'dalton', 'denver', 'brandon', 'shayla'].map(u => (
            <button key={u} onClick={() => setView(u)} className={`w-full p-3 rounded-lg font-semibold capitalize transition-all ${view === u ? uc[u].bg + ' text-white' : 'bg-zinc-800 text-zinc-300'}`}>
              {u}
            </button>
          ))}
        </div>
        <div className="w-full max-w-md bg-zinc-900 rounded-xl p-6 border border-zinc-700">
          <input type="password" placeholder="PIN" value={pin} onChange={e => { setPin(e.target.value); setPinErr(''); }} maxLength="4" className={`w-full bg-zinc-800 text-white text-center text-3xl rounded-lg py-3 mb-4 border ${pinErr ? 'border-red-500' : 'border-zinc-600'}`} />
          <button onClick={() => doLogin(view)} className={`w-full ${uc[view].bg} text-white py-3 rounded-lg font-semibold`}>Login</button>
          {pinErr && <p className="text-red-400 text-sm mt-3 text-center">{pinErr}</p>}
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-zinc-950 text-white flex flex-col pb-24">
      <header className={`sticky top-0 z-20 ${uc.bgLight} border-b border-zinc-800 px-4 py-4 flex justify-between items-center`}>
        <div>
          <h1 className={`text-2xl font-bold ${uc.accent}`}>{user.toUpperCase()}</h1>
          <p className="text-xs text-zinc-400">{dayNames[selectedDay]}</p>
        </div>
        <button onClick={doLogout} className="text-zinc-400 p-2"><I.Logout s={20}/></button>
      </header>

      <main className="flex-1 overflow-y-auto px-4 py-4">
        <div className="max-w-2xl mx-auto">
          {view === 'workout' && (
            <>
              <div className="mb-4 flex gap-1 overflow-x-auto no-scrollbar">
                {[1,2,3,4,5,6,7].map(d => (
                  <button key={d} onClick={() => setSelectedDay(d)} className={`flex-shrink-0 px-3 py-2 rounded-lg text-sm font-semibold transition-all ${selectedDay === d ? uc.bg : 'bg-zinc-800'}`}>
                    {dayNames[d][0]}{dayNames[d][1]}
                  </button>
                ))}
              </div>
              {currentWorkout && currentWorkout.exercises && currentWorkout.exercises.length > 0 ? (
                <div>
                  <h2 className={`text-2xl font-bold mb-4 ${uc.accent}`}>{currentWorkout.name}</h2>
                  <p className="text-sm text-zinc-500 mb-4">{currentWorkout.focus}</p>
                  <div className="space-y-3">
                    {currentWorkout.exercises.map((ex, exIdx) => (
                      <div key={exIdx} className={`bg-zinc-900 border ${uc.border} border-opacity-30 rounded-lg p-4`}>
                        <div className="flex justify-between items-start mb-2">
                          <div className="flex-1">
                            <h3 className="font-semibold text-sm">{ex.name}</h3>
                            <p className="text-xs text-zinc-500">{ex.muscle} • {ex.sets}×{ex.reps}</p>
                          </div>
                          {ex.notes && (
                            <button onClick={() => setShowInfo(showInfo === exIdx ? null : exIdx)} className="text-zinc-500 p-1">
                              <I.Info s={16} />
                            </button>
                          )}
                        </div>
                        {showInfo === exIdx && ex.notes && (
                          <p className={`text-xs ${uc.accent} mb-2 p-2 rounded ${uc.bgLight}`}>{ex.notes}</p>
                        )}
                        <div className="space-y-1.5">
                          {Array.from({ length: ex.sets }, (_, sIdx) => (
                            <div key={sIdx} className="flex items-center gap-2">
                              <span className="text-xs text-zinc-600 w-5">{sIdx+1}</span>
                              <input type="number" placeholder="lbs" value={getLog(selectedDay, exIdx, sIdx, 'wt')}
                                onChange={e => setLog(selectedDay, exIdx, sIdx, 'wt', e.target.value)}
                                className="w-16 bg-zinc-800 rounded px-2 py-1.5 text-xs text-center focus:outline-none focus:ring-1 focus:ring-purple-500" />
                              <input type="number" placeholder="reps" value={getLog(selectedDay, exIdx, sIdx, 'rp')}
                                onChange={e => setLog(selectedDay, exIdx, sIdx, 'rp', e.target.value)}
                                className="w-16 bg-zinc-800 rounded px-2 py-1.5 text-xs text-center focus:outline-none focus:ring-1 focus:ring-purple-500" />
                              <button onClick={() => toggleComplete(selectedDay, exIdx, sIdx)}
                                className={`w-7 h-7 rounded-full flex items-center justify-center transition-all ${isCompleted(selectedDay, exIdx, sIdx) ? uc.bg + ' text-white' : 'bg-zinc-800 text-zinc-600'}`}>
                                <I.Check s={14} />
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div className="text-center py-16 text-zinc-500">No workout for this day</div>
              )}
            </>
          )}

          {view === 'supplements' && (
            (user !== 'greg' && user !== 'ricki') ? (
              <div className="text-center py-16"><p className="text-4xl mb-4">✨</p><p className="text-zinc-500">No supplement protocol</p></div>
            ) : !suppAuthed ? (
              <div className="text-center py-16">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="mx-auto mb-4 text-zinc-500"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <h2 className="text-xl font-bold mt-2 mb-2">Protected</h2>
                <p className="text-zinc-500 mb-6">Enter supplement PIN</p>
                <input type="password" maxLength={4} value={suppPinInput} onChange={e => { setSuppPinInput(e.target.value.replace(/\D/g, '')); setSuppPinErr(false); }} onKeyDown={e => e.key === 'Enter' && doSuppAuth()} className={`w-48 text-center text-2xl p-3 rounded-xl bg-zinc-900 border ${suppPinErr ? 'border-red-500' : 'border-zinc-700'} focus:outline-none focus:border-purple-500 mx-auto block`} placeholder="••••" />
                {suppPinErr && <p className="text-red-400 text-sm mt-2">Wrong PIN</p>}
                <button onClick={doSuppAuth} className={`mt-4 px-8 py-3 rounded-xl ${uc.bg} text-white font-semibold`}>Unlock</button>
              </div>
            ) : (
              <div>
                <h2 className="text-xl font-bold mb-1">Supplements</h2>
                <p className="text-sm text-zinc-500 mb-4">{dayNames[todayDow]} • {dateKey}</p>
                {todaySupps.length === 0 ? (
                  <div className="text-center py-16"><p className="text-4xl mb-4">✨</p><p className="text-zinc-500">No supplements to track today</p></div>
                ) : (
                  <div className="space-y-2">
                    {todaySupps.map((s, i) => (
                      <button key={i} onClick={() => toggleSupp(s.name)}
                        className={`w-full flex items-center gap-3 p-3 rounded-xl border transition-all ${isSuppDone(s.name) ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-zinc-900 border-zinc-800'}`}>
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${isSuppDone(s.name) ? 'bg-emerald-500 text-white' : 'bg-zinc-800 text-zinc-600'}`}>
                          {isSuppDone(s.name) ? <I.Check s={16}/> : <span className="text-xs">{s.type === 'injection' ? '💉' : '💊'}</span>}
                        </div>
                        <div className="text-left flex-1">
                          <p className={`text-sm font-medium ${isSuppDone(s.name) ? 'text-emerald-400 line-through' : 'text-white'}`}>{s.name}</p>
                          <p className="text-xs text-zinc-500">{s.dose} • {s.time}</p>
                        </div>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            )
          )}

          {view === 'calendar' && (
            <div>
              <h2 className="text-xl font-bold mb-4">Weekly Schedule</h2>
              <div className="space-y-2">
                {['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map((day, i) => {
                  const dayNum = i + 1;
                  const workout = dayNum <= 6 ? workouts[dayNum] : null;
                  const isToday = dayMap[todayDow] === dayNum;
                  return (
                    <button key={day} onClick={() => { setSelectedDay(dayNum); setView('workout'); }}
                      className={`w-full p-3 rounded-xl text-left flex justify-between items-center border transition-all ${isToday ? uc.bgLight + ' ' + uc.border : 'bg-zinc-900 border-zinc-800'}`}>
                      <div>
                        <p className={`font-semibold text-sm ${isToday ? uc.accent : 'text-white'}`}>{day}</p>
                        <p className="text-xs text-zinc-500">{workout ? workout.name : 'Rest Day'}</p>
                      </div>
                      <p className="text-xs text-zinc-500">{workout ? workout.focus : '😴'}</p>
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      </main>

      <nav className="fixed bottom-0 left-0 right-0 bg-zinc-950/95 backdrop-blur border-t border-zinc-800 safe-bottom">
        <div className="flex justify-around py-2">
          {[
            { id: 'workout', icon: I.Dumbbell, label: 'Workout' },
            ...(todaySupps.length > 0 || (user === 'greg' || user === 'ricki') ? [{ id: 'supplements', icon: I.Pill, label: 'Supplements' }] : []),
            { id: 'calendar', icon: I.Calendar, label: 'Schedule' },
          ].map(t => (
            <button key={t.id} onClick={() => setView(t.id)}
              className={`flex flex-col items-center py-2 px-4 transition-all ${view === t.id ? uc.accent : 'text-zinc-500'}`}>
              <t.icon s={24}/><span className="text-xs mt-1">{t.label}</span>
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
