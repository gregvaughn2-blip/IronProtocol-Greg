<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Iron Protocol</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #09090b; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="password"] { letter-spacing: 0.3em; }
    .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 16px); }
    .no-sb::-webkit-scrollbar { display: none; }
    .no-sb { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ===== PIN HASHING =====
const hashPin = (pin) => {
  let h = 0;
  for (let i = 0; i < pin.length; i++) h = ((h << 5) - h) + pin.charCodeAt(i) & 0xffffffff;
  return h.toString();
};

const userPins = {
  greg: hashPin('1234'),
  ricki: hashPin('5678'),
  dalton: hashPin('0000'),
  denver: hashPin('2626'),
  brandon: hashPin('1980'),
  shayla: hashPin('1111')
};

const SUPP_PIN = hashPin('9999');

// ===== INDEXED DB =====
const DB = 'IronProtocolDB_v14';
const openDB = () => new Promise((res, rej) => {
  const r = indexedDB.open(DB, 1);
  r.onerror = () => rej(r.error);
  r.onsuccess = () => res(r.result);
  r.onupgradeneeded = e => e.target.result.createObjectStore('data', { keyPath: 'id' });
});

const save = async (id, data) => {
  try {
    const db = await openDB();
    return new Promise(res => {
      const tx = db.transaction('data', 'readwrite');
      tx.objectStore('data').put({ id, ...data, ts: Date.now() });
      tx.oncomplete = () => res(true);
    });
  } catch (e) {
    return false;
  }
};

const load = async (id) => {
  try {
    const db = await openDB();
    return new Promise(res => {
      const q = db.transaction('data', 'readonly').objectStore('data').get(id);
      q.onsuccess = () => res(q.result);
    });
  } catch (e) {
    return null;
  }
};

// ===== ICONS =====
const I = {
  Dumbbell: ({ s = 24 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 3h2M7 3v18M17 3h2M19 3v18M3 8h18M3 16h18"/></svg>,
  Pill: ({ s = 24 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/></svg>,
  Check: ({ s = 20 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>,
  Cal: ({ s = 24 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
  Logout: ({ s = 20 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 3l7 7-7 7M23 10H9"/></svg>,
  Home: ({ s = 24 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>,
  Gym: ({ s = 24 }) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 4h12v2H6zM5 8h14v8H5zM8 16h8v2H8z"/></svg>
};

// ===== WORKOUT DATA (GREG) =====
const gregWorkouts = {
  monday: { name: 'Chest Focus', focus: 'Chest/Shoulders', exercises: [{ name: 'Barbell Bench Press', sets: 4, reps: 8, gym: 'Barbell', home: 'Push-ups' }, { name: 'Incline DB Press', sets: 3, reps: 10, gym: 'Dumbbells', home: 'Incline push-ups' }, { name: 'Machine Fly', sets: 3, reps: 12, gym: 'Machine', home: 'Band flyes' }] },
  tuesday: { name: 'Back & Biceps', focus: 'Back/Biceps', exercises: [{ name: 'Lat Pulldown', sets: 4, reps: 8, gym: 'Machine', home: 'Assisted pull-ups' }, { name: 'Barbell Row', sets: 4, reps: 8, gym: 'Barbell', home: 'Dumbbell rows' }, { name: 'Barbell Curl', sets: 3, reps: 10, gym: 'Barbell', home: 'Dumbbell curls' }] },
  wednesday: { name: 'Legs', focus: 'Quads/Hamstrings', exercises: [{ name: 'Leg Press', sets: 4, reps: 8, gym: 'Machine', home: 'Pistol squats' }, { name: 'Leg Curl', sets: 3, reps: 10, gym: 'Machine', home: 'Nordic curls' }, { name: 'Leg Extension', sets: 3, reps: 12, gym: 'Machine', home: 'Jump squats' }] },
  thursday: { name: 'Shoulder Focus', focus: 'Shoulders', exercises: [{ name: 'Barbell OHP', sets: 4, reps: 8, gym: 'Barbell', home: 'Pike push-ups' }, { name: 'Lateral Raise', sets: 3, reps: 12, gym: 'Dumbbells', home: 'Resistance band raises' }, { name: 'Reverse Fly', sets: 3, reps: 12, gym: 'Machine', home: 'Band reverse flyes' }] },
  friday: { name: 'Full Body', focus: 'All', exercises: [{ name: 'Deadlift', sets: 4, reps: 6, gym: 'Barbell', home: 'Single-leg RDL' }, { name: 'Incline Treadmill', sets: 3, reps: '10min', gym: 'Cardio', home: 'Jump rope' }, { name: 'Core Circuit', sets: 3, reps: '30sec', gym: 'Abs machine', home: 'Planks' }] },
  saturday: { name: 'Active Recovery', focus: 'Cardio', exercises: [{ name: 'Light Cardio', sets: 1, reps: '30min', gym: 'Treadmill', home: 'Walking' }] },
  sunday: { name: 'Rest Day', focus: 'Recovery', exercises: [] }
};

// ===== WORKOUT DATA (DENVER) =====
const denverWorkouts = {
  monday: { name: 'Lower A', focus: 'Quads/Glutes', exercises: [{ name: 'Goblet Squat', sets: 3, reps: 12, gym: 'Dumbbell', home: 'Bodyweight squat' }, { name: 'Romanian Deadlift', sets: 3, reps: 10, gym: 'Barbell', home: 'Single-leg RDL' }, { name: 'Leg Extension', sets: 2, reps: 12, gym: 'Machine', home: 'Step-ups' }] },
  tuesday: { name: 'Upper A', focus: 'Chest/Back', exercises: [{ name: 'Machine Chest Press', sets: 3, reps: 12, gym: 'Machine', home: 'Push-ups' }, { name: 'Lat Pulldown', sets: 3, reps: 12, gym: 'Machine', home: 'Resistance band pull-downs' }, { name: 'Dumbbell Row', sets: 3, reps: 10, gym: 'Dumbbells', home: 'Dumbbell rows' }] },
  wednesday: { name: 'Rest Day', focus: 'Recovery', exercises: [] },
  thursday: { name: 'Lower B', focus: 'Hamstrings/Glutes', exercises: [{ name: 'Leg Press', sets: 3, reps: 12, gym: 'Machine', home: 'Jump squats' }, { name: 'Leg Curl', sets: 3, reps: 12, gym: 'Machine', home: 'Stability ball curls' }, { name: 'Walking Lunge', sets: 3, reps: 10, gym: 'Dumbbells', home: 'Bodyweight lunges' }] },
  friday: { name: 'Upper B', focus: 'Shoulders/Arms', exercises: [{ name: 'Dumbbell Shoulder Press', sets: 3, reps: 10, gym: 'Dumbbells', home: 'Pike push-ups' }, { name: 'Dumbbell Curl', sets: 3, reps: 12, gym: 'Dumbbells', home: 'Dumbbell curls' }, { name: 'Tricep Dip', sets: 2, reps: 10, gym: 'Machine', home: 'Bench dips' }] },
  saturday: { name: 'Active Recovery', focus: 'Cardio', exercises: [{ name: 'Light Cardio', sets: 1, reps: '20min', gym: 'Elliptical', home: 'Walk' }] },
  sunday: { name: 'Rest Day', focus: 'Recovery', exercises: [] }
};

// ===== SUPPLEMENT DATA =====
const suppData = {
  greg: {
    monday: [{ name: 'Tesamorelin', dose: '2mg', type: 'Inject' }, { name: 'Ipamorelin', dose: '1.5mg', type: 'Inject' }],
    tuesday: [{ name: 'BPC-157', dose: '250mcg', type: 'Oral' }, { name: 'TB-500', dose: '2mg', type: 'Inject' }],
    wednesday: [{ name: 'Retatrutide', dose: '0.5mg', type: 'Inject' }],
    thursday: [{ name: 'Tesamorelin', dose: '2mg', type: 'Inject' }, { name: 'Ipamorelin', dose: '1.5mg', type: 'Inject' }],
    friday: [{ name: 'BPC-157', dose: '250mcg', type: 'Oral' }],
    saturday: [{ name: 'TB-500', dose: '2mg', type: 'Inject' }],
    sunday: [{ name: 'Retatrutide', dose: '0.5mg', type: 'Inject' }]
  },
  ricki: {
    monday: [{ name: 'Collagen', dose: '10g', type: 'Powder' }, { name: 'Magnesium', dose: '400mg', type: 'Oral' }],
    tuesday: [{ name: 'Omega-3', dose: '2g', type: 'Oral' }],
    wednesday: [{ name: 'Vitamin D', dose: '4000IU', type: 'Oral' }],
    thursday: [{ name: 'Collagen', dose: '10g', type: 'Powder' }],
    friday: [{ name: 'Omega-3', dose: '2g', type: 'Oral' }],
    saturday: [{ name: 'Magnesium', dose: '400mg', type: 'Oral' }],
    sunday: []
  }
};

// ===== MAIN APP =====
function IronProtocol() {
  const [user, setUser] = useState(null);
  const [pin, setPin] = useState('');
  const [pinError, setPinError] = useState('');
  const [view, setView] = useState('workout');
  const [selectedDay, setSelectedDay] = useState(1);
  const [gymMode, setGymMode] = useState(true);
  const [tracking, setTracking] = useState({});

  useEffect(() => {
    const loadUser = async () => {
      const stored = await load('user');
      if (stored && stored.user) setUser(stored.user);
    };
    loadUser();
  }, []);

  const login = async (username) => {
    const userPin = userPins[username];
    if (!userPin || hashPin(pin) !== userPin) {
      setPinError('Wrong PIN');
      return;
    }
    setUser(username);
    setPin('');
    setPinError('');
    await save('user', { user: username });
  };

  const logout = async () => {
    setUser(null);
    setPin('');
    await save('user', { user: null });
  };

  if (!user) {
    return (
      <div className="flex flex-col items-center justify-center min-h-screen bg-gradient-to-b from-zinc-900 to-black p-4">
        <div className="w-full max-w-sm">
          <h1 className="text-3xl font-bold text-white mb-8 text-center">Iron Protocol</h1>
          <div className="space-y-3">
            {['greg', 'ricki', 'dalton', 'denver', 'brandon', 'shayla'].map(u => (
              <button key={u} onClick={() => setView(u)} className={`w-full py-3 rounded-lg font-semibold transition-all ${view === u ? 'bg-purple-600 text-white' : 'bg-zinc-800 text-zinc-300'}`}>
                {u.charAt(0).toUpperCase() + u.slice(1)}
              </button>
            ))}
          </div>
          <div className="mt-6 p-4 bg-zinc-800 rounded-lg">
            <input type="password" placeholder="PIN" value={pin} onChange={(e) => setPin(e.target.value)} maxLength="4" className="w-full bg-zinc-700 text-white rounded px-3 py-2 text-center text-2xl mb-2"/>
            <button onClick={() => login(view)} className="w-full bg-purple-600 text-white py-2 rounded-lg font-semibold">Login</button>
            {pinError && <p className="text-red-400 text-sm mt-2">{pinError}</p>}
          </div>
        </div>
      </div>
    );
  }

  const workouts = user === 'denver' ? denverWorkouts : gregWorkouts;
  const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const todayDow = new Date().getDay();
  const dayKey = dayNames[selectedDay === 7 ? 0 : selectedDay].toLowerCase();
  const workout = workouts[dayKey];

  return (
    <div className="min-h-screen bg-black text-white pb-24">
      {/* Header */}
      <div className="sticky top-0 bg-gradient-to-b from-zinc-900 to-transparent p-4 border-b border-zinc-800 flex justify-between items-center">
        <h1 className="text-xl font-bold">Iron Protocol • {user.toUpperCase()}</h1>
        <button onClick={logout} className="p-2 bg-zinc-800 rounded-lg"><I.Logout s={18}/></button>
      </div>

      {/* Content */}
      <div className="max-w-2xl mx-auto p-4">
        {view === 'workout' && (
          <>
            {/* Day Selector */}
            <div className="flex gap-2 overflow-x-auto mb-4 no-sb pb-2">
              {dayNames.map((d, i) => (
                <button key={i} onClick={() => setSelectedDay(i === 0 ? 7 : i)} className={`flex-shrink-0 px-4 py-2 rounded-lg text-sm font-semibold transition-all ${selectedDay === (i === 0 ? 7 : i) ? 'bg-purple-600' : 'bg-zinc-800'}`}>
                  {d.slice(0, 3)}
                </button>
              ))}
            </div>

            {/* Gym/Home Toggle */}
            {(user === 'denver' || user === 'greg') && (
              <div className="mb-4 flex gap-2">
                <button onClick={() => setGymMode(true)} className={`flex-1 py-2 rounded-lg font-semibold transition-all ${gymMode ? 'bg-purple-600' : 'bg-zinc-800'}`}>
                  <I.Gym s={16}/> Gym
                </button>
                <button onClick={() => setGymMode(false)} className={`flex-1 py-2 rounded-lg font-semibold transition-all ${!gymMode ? 'bg-purple-600' : 'bg-zinc-800'}`}>
                  <I.Home s={16}/> Home
                </button>
              </div>
            )}

            {/* Workout */}
            {workout && workout.exercises.length > 0 && (
              <div className="space-y-3">
                <h2 className="text-2xl font-bold">{workout.name}</h2>
                {workout.exercises.map((ex, i) => (
                  <div key={i} className="bg-zinc-900 p-4 rounded-lg border border-zinc-800">
                    <h3 className="font-semibold text-lg mb-2">{ex.name}</h3>
                    <p className="text-sm text-zinc-400 mb-2">{ex.sets} sets × {ex.reps}</p>
                    <p className="text-sm text-purple-400">{gymMode ? ex.gym : ex.home}</p>
                  </div>
                ))}
              </div>
            )}
            {(!workout || workout.exercises.length === 0) && (
              <div className="text-center py-12 text-zinc-500">Rest Day</div>
            )}
          </>
        )}

        {view === 'supplements' && (user === 'greg' || user === 'ricki') && (
          <div className="space-y-3">
            <h2 className="text-2xl font-bold mb-4">Supplements</h2>
            {suppData[user]?.[dayKey]?.map((s, i) => (
              <div key={i} className="bg-zinc-900 p-4 rounded-lg border border-zinc-800 flex justify-between items-center">
                <div>
                  <h3 className="font-semibold">{s.name}</h3>
                  <p className="text-sm text-zinc-400">{s.dose} • {s.type}</p>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Bottom Nav */}
      <div className="fixed bottom-0 left-0 right-0 bg-zinc-900 border-t border-zinc-800 safe-bottom flex justify-around">
        <button onClick={() => setView('workout')} className={`flex-1 py-4 transition-all ${view === 'workout' ? 'text-purple-400' : 'text-zinc-500'}`}><I.Dumbbell s={24}/></button>
        {(user === 'greg' || user === 'ricki') && <button onClick={() => setView('supplements')} className={`flex-1 py-4 transition-all ${view === 'supplements' ? 'text-purple-400' : 'text-zinc-500'}`}><I.Pill s={24}/></button>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<IronProtocol />);
  </script>
</body>
</html>
